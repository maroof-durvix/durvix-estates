<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes durvix-rise { 0% { opacity:0; transform: translateY(14px) scale(0.98); } 100% { opacity:1; transform: translateY(0) scale(1); } }
  @keyframes durvix-glow { 0%,100% { opacity:0.35; } 50% { opacity:0.85; } }
  @keyframes durvix-spin { to { transform: rotate(360deg); } }
  @keyframes durvix-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes durvix-fadein { from { opacity:0; } to { opacity:1; } }
  body { margin:0; }
</style>
</helmet>

<div style="width:100%;height:100vh;min-height:640px;background:oklch(0.99 0.002 90);position:relative;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

  <sc-if value="{{ showLoader }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:36px;background:oklch(0.99 0.002 90);opacity:{{ loaderOpacity }};transition:opacity 0.6s ease;pointer-events:none;">

      <div style="position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center;">
        <svg width="190" height="190" viewBox="0 0 190 190" style="position:absolute;top:0;left:0;transform:rotate(-90deg);">
          <circle cx="95" cy="95" r="82" fill="none" stroke="oklch(0.93 0.01 80)" stroke-width="2"></circle>
          <circle cx="95" cy="95" r="82" fill="none" stroke="#a9793f" stroke-width="2.5" stroke-linecap="round"
            stroke-dasharray="515.2" stroke-dashoffset="{{ ringOffset }}" style="transition: stroke-dashoffset 0.15s linear;"></circle>
        </svg>
        <div style="width:128px;height:128px;display:flex;align-items:center;justify-content:center;animation:durvix-rise 0.9s ease both, durvix-glow 2.2s ease-in-out infinite 0.9s;">
          <img src="assets/durvix-logo.png" alt="Durvix Estates" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(20,20,20,0.10));"></img>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;animation:durvix-fadein 0.8s ease 0.3s both;">
        <div style="font-size:13px;letter-spacing:0.42em;font-weight:600;color:#1a1a1a;text-transform:uppercase;">Durvix Estates</div>
        <div style="width:220px;height:3px;border-radius:2px;background:oklch(0.93 0.01 80);overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:{{ percent }}%;background:#a9793f;border-radius:2px;transition:width 0.15s linear;"></div>
        </div>
        <div style="font-size:12px;letter-spacing:0.14em;color:#8a8a8a;font-variant-numeric:tabular-nums;">{{ percentLabel }}%</div>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;opacity:{{ contentOpacity }};transition:opacity 0.7s ease 0.1s;">
    <img src="assets/durvix-logo.png" alt="Durvix Estates" style="width:120px;height:120px;object-fit:contain;"></img>
    <div style="font-size:14px;letter-spacing:0.08em;color:#5b5b5b;max-width:420px;text-align:center;line-height:1.6;">
      Welcome to Durvix Estates. Your page content starts here — replace this section with your homepage.
    </div>
    <button onClick="{{ replay }}" style="margin-top:8px;padding:10px 26px;border-radius:2px;border:1px solid #1a1a1a;background:transparent;color:#1a1a1a;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;">Replay Loader</button>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600}}">
const CIRC = 515.2;

class Component extends DCLogic {
  state = { percent: 0, showLoader: true, loaderOpacity: 1, contentOpacity: 0 };

  componentDidMount() {
    this.start();
  }

  start() {
    clearInterval(this._timer);
    clearTimeout(this._hideTimer);
    this.setState({ percent: 0, showLoader: true, loaderOpacity: 1, contentOpacity: 0 });
    const duration = 2200;
    const stepMs = 30;
    const steps = duration / stepMs;
    let i = 0;
    this._timer = setInterval(() => {
      i++;
      const t = Math.min(i / steps, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      const pct = Math.round(eased * 100);
      this.setState({ percent: pct });
      if (t >= 1) {
        clearInterval(this._timer);
        this.setState({ loaderOpacity: 0, contentOpacity: 1 });
        this._hideTimer = setTimeout(() => this.setState({ showLoader: false }), 650);
      }
    }, stepMs);
  }

  componentWillUnmount() {
    clearInterval(this._timer);
    clearTimeout(this._hideTimer);
  }

  renderVals() {
    const pct = this.state.percent;
    return {
      percent: pct,
      percentLabel: pct,
      ringOffset: CIRC - (CIRC * pct) / 100,
      showLoader: this.state.showLoader,
      loaderOpacity: this.state.loaderOpacity,
      contentOpacity: this.state.contentOpacity,
      replay: () => this.start()
    };
  }
}
</script>
</body>
</html>
